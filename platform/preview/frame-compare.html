<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><link rel="icon" href="../assets/branding/vaccino-logo.png">
<title>Ø30 şasi önizleme — VACCİNO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
  :root { --bg: #090B0D; --surface: #171B1E; --ivory: #F5F2ED; --champagne: #CBB98B; --muted: #B3ADA3; --hairline: #2B3135; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ivory); font: 15px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; height: 100%; padding: 20px; }
  .stage { position: relative; border: 1px solid var(--hairline); border-radius: 14px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #2a2e32, #101315 75%); min-height: 420px; }
  canvas { display: block; width: 100%; height: 100%; }
  .tag { position: absolute; left: 16px; top: 16px; font-size: 12px; letter-spacing: .06em; color: var(--muted); }
  aside { border: 1px solid var(--hairline); border-radius: 14px; background: var(--surface); padding: 16px; overflow: auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; } p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  label { display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--hairline); font-size: 14px; }
  input { width: 18px; height: 18px; accent-color: var(--champagne); }
  .badge { margin-left: auto; padding: 2px 9px; border: 1px solid rgb(203 185 139 / 60%); border-radius: 999px; font-size: 12px; color: var(--champagne); white-space: nowrap; }
  .badge.rep { border-style: dashed; color: #D8D2C8; border-color: #8a857c; }
  .badge.unk { color: #E9C08A; border-color: #E9C08A; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } .stage { height: 60vh; } }
</style></head>
<body><main>
  <div class="stage"><canvas id="c" aria-label="Ø30 boru şasi çiziminin 3B önizlemesi"></canvas><span class="tag">Ø30 BORU ŞASİ · STEP ÇİZİMİ (ÖNİZLEME)</span></div>
  <aside>
    <h1>Ø30 şasi önizleme</h1>
    <p>Kaynak: 27 Kasım 2026 STEP çizimi. Borular çizimde dolu çubuk; kütle bu modelden hesaplanmaz (iskelet ≈ 17 kg, Tahmin). Bu sayfa menüye bağlı değildir.</p>
    <div id="layers"></div>
  </aside>
</main>
<script src="../vendor/three.js"></script>
<script type="module">
const T = window.THREE;
const {GLTFLoader} = await import('../vendor/driver-gltf-loader.js');
const layers = [
  ['Frame', 'İskelet (Ø30 × 2, çizim)', 'Aday', '', true],
  ['BatteryBox', 'Akü kutusu (9×5, çizim)', 'Tahmin', '', true],
  ['UnknownPartL', 'Belirsiz parça · sol', 'Belirsiz parça', 'unk', true],
  ['UnknownPartR', 'Belirsiz parça · sağ', 'Belirsiz parça', 'unk', true],
  ['RepWheels', 'Tekerlek 16″', 'Temsili', 'rep', true],
  ['RepSuspension', 'Süspansiyon (çift salıncak)', 'Temsili', 'rep', true],
  ['RepDrivetrain', 'Motor + diferansiyel, akslar', 'Temsili', 'rep', true],
  ['RepSeat', 'Koltuk', 'Temsili', 'rep', true],
  ['RepShell', 'Kabuk', 'Temsili', 'rep', false]
];
const M = o => new T.MeshPhysicalMaterial(o);
const materials = {
  Frame: M({color: 0xC9CDD0, metalness: .65, roughness: .32}),
  BatteryBox: M({color: 0x2F7BD8, metalness: .2, roughness: .45}),
  UnknownPartL: M({color: 0xE9A85B, roughness: .5, transparent: true, opacity: .85}),
  UnknownPartR: M({color: 0xE9A85B, roughness: .5, transparent: true, opacity: .85}),
  RepWheels: M({color: 0x2a2c2e, roughness: .8, transparent: true, opacity: .7}),
  RepSuspension: M({color: 0x9aa0a6, roughness: .5, transparent: true, opacity: .7}),
  RepDrivetrain: M({color: 0x6f757b, roughness: .5, transparent: true, opacity: .75}),
  RepSeat: M({color: 0x3b4045, roughness: .7, transparent: true, opacity: .75}),
  RepShell: M({color: 0xffffff, roughness: .2, transparent: true, opacity: .12, depthWrite: false, side: T.DoubleSide})
};
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({canvas, antialias: true, alpha: true});
renderer.outputColorSpace = T.SRGBColorSpace; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new T.Scene();
scene.add(new T.HemisphereLight(0xf0f3f8, 0x3a3734, 1.6));
const key = new T.DirectionalLight(0xfff3e4, 2.4); key.position.set(-3, 4, 3); scene.add(key);
const room = new T.Scene(); room.background = new T.Color(0x5b6066);
for (const [x, y, z] of [[-3, 3, 3], [3, 2, -2], [0, 4, 0]]) { const p = new T.Mesh(new T.PlaneGeometry(3, 3), new T.MeshBasicMaterial({color: 0xffffff})); p.position.set(x, y, z); p.lookAt(0, 0, 0); room.add(p); }
const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromScene(room, .03).texture;
const camera = new T.PerspectiveCamera(30, 1, .05, 50);
const gltf = await new GLTFLoader().loadAsync('../assets/vehicle/frame-step.glb');
const byName = {};
gltf.scene.traverse(o => { if (o.isMesh) { o.material = materials[o.name] ?? materials.Frame; byName[o.name] = o; } });
byName.RepShell && (byName.RepShell.renderOrder = 5);
scene.add(gltf.scene);
const box = new T.Box3().setFromObject(byName.Frame), c = box.getCenter(new T.Vector3()), r = box.getSize(new T.Vector3()).length() / 2;
function frame() {
  const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const d = r / Math.sin(T.MathUtils.degToRad(camera.fov / 2)) * .82;
  camera.position.copy(c).add(new T.Vector3(-.62, .52, .58).normalize().multiplyScalar(d)); camera.lookAt(c);
  renderer.render(scene, camera);
}
const list = document.getElementById('layers');
for (const [name, label, badge, kind, on] of layers) {
  const row = document.createElement('label');
  row.innerHTML = `<input type="checkbox" ${on ? 'checked' : ''}> <span></span> <span class="badge ${kind}"></span>`;
  row.querySelector('span').textContent = label; row.querySelector('.badge').textContent = badge;
  const box = row.querySelector('input'); if (byName[name]) byName[name].visible = on;
  box.addEventListener('change', () => { if (byName[name]) byName[name].visible = box.checked; frame(); });
  list.append(row);
}
new ResizeObserver(frame).observe(canvas); frame();
document.body.dataset.ready = '1';
</script></body></html>
